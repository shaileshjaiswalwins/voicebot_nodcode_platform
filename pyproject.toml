[project]
name = "livekit-native-acmecorp-bot"
version = "0.1.0"
description = "Standalone LiveKit-Agents replica of the Pipecat AcmeCorp bot"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[google,silero]>=1.0",
    "livekit-plugins-sarvam>=1.3.0",
    "livekit-plugins-deepgram>=1.0",
    "livekit-plugins-elevenlabs>=1.0",
    "langfuse>=2.0",
    "langsmith>=0.1",
    "livekit-api>=0.7.0",
    "google-genai>=1.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pymongo>=3.12,<4",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.8",
    "python-multipart>=0.0.32",
    "requests>=2.34.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["bot.py"]

[tool.ruff]
line-length = 100
