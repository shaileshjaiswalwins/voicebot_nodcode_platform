[project]
name = "livekit-native-justdial-bot"
version = "0.1.0"
description = "Standalone LiveKit-Agents replica of the Pipecat JustDial bot"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[google,silero]>=1.0",
    "livekit-api>=0.7.0",
    "google-genai>=1.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
