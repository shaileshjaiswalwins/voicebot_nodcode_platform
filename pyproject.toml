[project]
name = "livekit-native-justdial-bot"
version = "0.1.0"
description = "Standalone LiveKit-Agents replica of the Pipecat JustDial bot"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[google,silero]>=1.0",
    "livekit-api>=0.7.0",
    "google-genai>=1.0",
    "aiohttp>=3.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pymongo>=3.12,<4",
    "langfuse>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["bot.py", "voicebot_platform"]

[tool.ruff]
line-length = 100
