[project]
name = "livekit-native-justdial-bot"
version = "0.1.0"
description = "Standalone LiveKit-Agents replica of the Pipecat JustDial bot"
requires-python = ">=3.10"
dependencies = [
    # Rapidly evolving libs — cap to current major so `uv lock` regen can't
    # silently pull a breaking change. Bump these intentionally.
    "livekit-agents[google,silero]>=1.0,<2",
    "livekit-api>=0.7.0,<2",
    "google-genai>=2.0,<3",
    "aiohttp>=3.9,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-dotenv>=1.0,<2",
    "loguru>=0.7,<1",
    # pymongo 3.x is EOL; track upgrade work separately. Until then, stay on 3.x.
    "pymongo>=3.12,<4",
    "langfuse>=4.0,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "mongomock>=4.1,<5",
    "httpx>=0.27,<1",  # FastAPI TestClient backbone
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["bot.py", "voicebot_platform"]

[tool.ruff]
line-length = 100
