name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -e . || pip install -r requirements.txt || pip install fastapi uvicorn pymongo mongomock pyjwt python-dotenv pytest pytest-asyncio httpx
      - name: Run backend tests
        run: python -m pytest backend/tests/ -v
      - name: Run callback_worker tests
        run: python -m pytest callback_worker/test_config.py -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Build
        run: npm run build
