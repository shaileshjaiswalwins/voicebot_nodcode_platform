[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
; Log dir must exist before starting: mkdir -p /var/log/voicebot
logfile=/var/log/voicebot/supervisord.log
logfile_maxbytes=20MB
logfile_backups=5
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ─── Bot worker ──────────────────────────────────────────────────────────────
[program:voicebot-worker]
; DEPLOY NOTE: update 'directory' and 'command' path to uv for your server.
; Find uv path with: which uv
command=/Users/justdial/.local/bin/uv run python bot.py start
directory=/Users/justdial/voicebot_nodcode_platform
; Load all env vars from .env — supervisord does not source .env automatically.
environment=VOICEBOT_ENV="%(ENV_VOICEBOT_ENV)s",HOME="/Users/justdial",PATH="/Users/justdial/.local/bin:/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startretries=10
startsecs=5
stopwaitsecs=30
stdout_logfile=/var/log/voicebot/bot-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/voicebot/bot-worker-err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
; Kill the entire process group so orphan threads don't hold LiveKit sessions.
killasgroup=true
stopasgroup=true

; ─── API server ──────────────────────────────────────────────────────────────
[program:voicebot-api]
; DEPLOY NOTE: update 'directory' and 'command' path to uv for your server.
command=/Users/justdial/.local/bin/uv run uvicorn voicebot_platform.api:app --host 0.0.0.0 --port 8000 --workers 2
directory=/Users/justdial/voicebot_nodcode_platform
environment=VOICEBOT_ENV="%(ENV_VOICEBOT_ENV)s",HOME="/Users/justdial",PATH="/Users/justdial/.local/bin:/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=15
stdout_logfile=/var/log/voicebot/api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/voicebot/api-err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
killasgroup=true
stopasgroup=true

; ─── Callback worker (if used) ────────────────────────────────────────────────
[program:voicebot-callback]
; DEPLOY NOTE: set autostart=true if callback_worker is active on this server.
command=/Users/justdial/.local/bin/uv run python -m callback_worker.worker
directory=/Users/justdial/voicebot_nodcode_platform
environment=VOICEBOT_ENV="%(ENV_VOICEBOT_ENV)s",HOME="/Users/justdial",PATH="/Users/justdial/.local/bin:/usr/local/bin:/usr/bin:/bin"
autostart=false
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=15
stdout_logfile=/var/log/voicebot/callback.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/voicebot/callback-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
killasgroup=true
stopasgroup=true

[group:voicebot]
programs=voicebot-worker,voicebot-api,voicebot-callback
