; Production process supervisor for voicebot_nodcode_platform.
;
; Why this file exists: none of these four processes are self-healing on their own.
; bot.py / callback_worker / campaign_dialer_worker are plain `python x.py start` scripts
; with no restart logic, and voicebot's admin API is a plain uvicorn invocation. If any of
; them crash (uncaught exception, an unresponsive Mongo call stalling the event loop past
; LiveKit's job heartbeat, an OOM kill, etc.) nothing brings them back — the process just
; stays dead until a human notices and re-runs the start script. supervisord's job here is
; narrowly that: detect death, restart automatically, and log both the death and the
; restart so it's visible after the fact.
;
; Deliberately NOT trying to fix root causes here (e.g. blocking Mongo calls in bot.py's
; async event loop) — that's a separate, code-level fix. This file is the safety net
; underneath it, so a transient failure recovers on its own instead of requiring a human
; at 2am. Two settings matter most for correctness on this specific codebase:
;   1. stopwaitsecs is generous for `bot` — bot.py's LiveKit WorkerOptions already does its
;      own graceful job-draining on SIGTERM; supervisord must give it time to finish
;      in-flight calls before escalating to SIGKILL, or a routine restart drops live calls.
;   2. startsecs + startretries together prevent restart storms: a process that crashes
;      within startsecs of starting doesn't count as "started successfully", so a
;      fast-crash-loop (e.g. Mongo totally unreachable at boot) exhausts startretries and
;      lands in FATAL rather than respawning forever and hammering a downed dependency.
;
; Deploy notes:
;   - Paths below assume this repo is checked out at /opt/voicebot_nodcode_platform and
;     dependencies are managed with `uv` (matches start.sh/start_dev.sh/start_pipeline.sh).
;     Adjust `directory`/`command` if the real deploy path differs — do NOT guess-fix this
;     against the live server without diffing against whatever supervisord is currently
;     running there.
;   - `environment=` lines only forward variables supervisord itself needs (HOME/PATH for
;     `uv` to resolve); actual app config (MONGO_URI, LIVEKIT_*, DASHBOARD_JWT_SECRET, etc.)
;     is loaded from .env by each process the same way it is today (python-dotenv) — this
;     file does not duplicate secrets.
;   - Apply with: `supervisorctl reread && supervisorctl update`, then restart only the
;     specific program that changed — never `supervisorctl restart all` on the live server
;     (see docs/KT_Apratim.md: restarting the wrong process drops active calls).

[unix_http_server]
file=/var/run/supervisor-voicebot.sock
chmod=0700

[supervisord]
logfile=/var/log/voicebot/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
pidfile=/var/run/supervisor-voicebot.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor-voicebot.sock

; ---------------------------------------------------------------------------
; [1] LiveKit voice bot worker — connects to LiveKit SFU, runs live calls.
; Highest-risk process to restart carelessly: an in-progress call lives inside this
; process. autorestart=true still applies (a crashed bot is worse than a restarted one),
; but stopwaitsecs is long so a *deliberate* stop/restart drains first.
; ---------------------------------------------------------------------------
[program:voicebot-bot]
directory=/opt/voicebot_nodcode_platform
command=/root/.local/bin/uv run python bot.py start
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
user=voicebot
environment=HOME="/home/voicebot",PATH="/home/voicebot/.local/bin:%(ENV_PATH)s"
stdout_logfile=/var/log/voicebot/bot.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/voicebot/bot.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; ---------------------------------------------------------------------------
; [2] Admin/platform API — FastAPI app serving the React dashboard + test-call/analytics
; endpoints. Stateless HTTP; safe to restart freely, so stopwaitsecs is short.
; ---------------------------------------------------------------------------
[program:voicebot-api]
directory=/opt/voicebot_nodcode_platform
command=/root/.local/bin/uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 2
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
user=voicebot
environment=HOME="/home/voicebot",PATH="/home/voicebot/.local/bin:%(ENV_PATH)s"
stdout_logfile=/var/log/voicebot/api.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/voicebot/api.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; ---------------------------------------------------------------------------
; [3] Post-call analysis + callback dispatcher — polls Mongo for untagged transcripts.
; Already handles SIGTERM gracefully (finishes current batch before exiting — see
; callback_worker/worker.py's _handle_signal), so a moderate stopwaitsecs is enough.
; ---------------------------------------------------------------------------
[program:voicebot-callback-worker]
directory=/opt/voicebot_nodcode_platform
command=/root/.local/bin/uv run python -m callback_worker.worker
; autostart=false to match documented production behavior (docs/KT_Apratim.md: "enabled
; manually in production"). Once started (autostart or `supervisorctl start`), autorestart
; still applies so a crash recovers without needing the manual step repeated.
autostart=false
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
user=voicebot
environment=HOME="/home/voicebot",PATH="/home/voicebot/.local/bin:%(ENV_PATH)s"
stdout_logfile=/var/log/voicebot/callback_worker.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/voicebot/callback_worker.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; ---------------------------------------------------------------------------
; [4] Campaign dialer worker — polls active/scheduled campaigns and pushes leads to
; TSPL's outbound-dialer API (see campaign_dialer_worker/worker.py). Also handles SIGTERM
; gracefully (finishes current tick). Not in the original 3-process KT doc — added here
; because the batch-call feature now depends on this process actually running for
; anything to dial out.
; ---------------------------------------------------------------------------
[program:voicebot-campaign-dialer-worker]
directory=/opt/voicebot_nodcode_platform
command=/root/.local/bin/uv run python -m campaign_dialer_worker.worker
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
user=voicebot
environment=HOME="/home/voicebot",PATH="/home/voicebot/.local/bin:%(ENV_PATH)s"
stdout_logfile=/var/log/voicebot/campaign_dialer_worker.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/voicebot/campaign_dialer_worker.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; ---------------------------------------------------------------------------
; [5] Alert-evaluation worker — polls tbl_ai_vb_alert_rules for due rules, computes each
; rule's metric (see backend/metrics.py::compute_metric), and opens/resolves
; tbl_ai_vb_alert_incidents (see alert_worker/worker.py). Supervisor-managed from day one
; per the alerting plan, so this doesn't repeat the gap already found where the
; call-serving process had no crash recovery.
; ---------------------------------------------------------------------------
[program:voicebot-alert-worker]
directory=/opt/voicebot_nodcode_platform
command=/root/.local/bin/uv run python -m alert_worker.worker
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
user=voicebot
environment=HOME="/home/voicebot",PATH="/home/voicebot/.local/bin:%(ENV_PATH)s"
stdout_logfile=/var/log/voicebot/alert_worker.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/voicebot/alert_worker.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
