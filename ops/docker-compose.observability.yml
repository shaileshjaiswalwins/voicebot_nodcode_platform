services:
  livekit-monitor:
    image: jossephus/livekit-monitor:latest
    restart: unless-stopped
    ports:
      - "9095:9095"
    environment:
      LIVEKIT_URL: "${LIVEKIT_URL}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      PORT: "9095"

  langfuse-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: "${LANGFUSE_POSTGRES_PASSWORD:-change-me}"
    volumes:
      - langfuse-db:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      - langfuse-db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:-change-me}@langfuse-db:5432/langfuse"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-change-me}"
      SALT: "${LANGFUSE_SALT:-change-me}"
      NEXTAUTH_URL: "${LANGFUSE_PUBLIC_URL:-http://localhost:3000}"

volumes:
  langfuse-db:
